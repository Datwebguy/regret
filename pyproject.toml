[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "regret"
version = "0.1.0"
description = "REGRET is a trading decision product that evaluates proposed trades against live market data, a user's rules, portfolio, and risk constraints before execution."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "REGRET" }]
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "httpx>=0.28.0",
  "cryptography>=44.0.0",
  "bcrypt>=4.2.0",
  "itsdangerous>=2.2.0",
  "python-multipart>=0.0.17",
  "typer>=0.15.0",
  "rich>=13.9.0",
  "mcp>=1.2.0",
  "email-validator>=2.2.0",
  "psycopg[binary]>=3.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.28.0",
]

[project.scripts]
regret = "regret.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
