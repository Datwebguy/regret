<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; width: 256px; height: 256px; overflow: hidden; }
      body {
        background: #e9e1cf;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .mark {
        width: 220px;
        height: 220px;
        border: 2px solid #1a1612;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #f4eee0;
      }
      .word {
        font-family: "Fraunces", "Times New Roman", serif;
        font-weight: 600;
        font-size: 28px;
        letter-spacing: 0.28em;
        color: #1a1612;
        padding-left: 0.28em;
      }
      .word i { font-style: italic; color: #8e2a24; font-weight: 500; }
      .rule { width: 72px; height: 3px; background: #8e2a24; margin-top: 10px; }
    </style>
  </head>
  <body>
    <div class="mark">
      <div class="word">RE<i>GRET</i></div>
      <div class="rule"></div>
    </div>
  </body>
</html>
