services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: regret
      POSTGRES_PASSWORD: regret
      POSTGRES_DB: regret
    ports:
      - "5432:5432"
    volumes:
      - regret_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U regret"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  regret_pg:
